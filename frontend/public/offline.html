<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>버디빌 - 인터넷 연결 필요</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; font-family: 'Malgun Gothic', sans-serif; color: #0f172a; }
      .box { text-align: center; padding: 32px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #64748b; font-size: 14px; margin: 0 0 20px; }
      button { background: #0f172a; color: #fff; border: 0; border-radius: 6px; padding: 10px 20px; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icon-192.png" width="72" height="72" alt="" />
      <h1>인터넷에 연결되어 있지 않습니다</h1>
      <p>버디빌은 인터넷이 연결되어야 사용할 수 있습니다. 연결을 확인한 뒤 다시 시도해주세요.</p>
      <button onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
